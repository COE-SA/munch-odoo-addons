<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Munch Bakery — لوحة التحليل المالي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"><\/script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--bg4:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f0b429;--green:#3fb950;--red:#f85149;--blue:#58a6ff;--purple:#a371f7;--border:#30363d;--r:8px;--rl:12px}
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;direction:rtl;font-size:14px}
.bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 24px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.logo{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600}
.live-b{font-size:11px;background:rgba(63,185,80,.12);color:var(--green);border:1px solid rgba(63,185,80,.25);padding:3px 10px;border-radius:20px;display:flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.upd{font-size:11px;color:var(--text2);font-family:'IBM Plex Mono',monospace}
.main{padding:20px 24px;max-width:1400px;margin:0 auto}
.hdr{margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}
.hdr h2{font-size:20px;font-weight:700}.hdr p{font-size:12px;color:var(--text2);margin-top:3px}
.per{font-size:12px;color:var(--gold);background:rgba(240,180,41,.1);border:1px solid rgba(240,180,41,.2);padding:4px 12px;border-radius:20px}
.kgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.kc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:14px 16px;position:relative;overflow:hidden}
.kc::before{content:'';position:absolute;top:0;right:0;width:3px;height:100%}
.kc.g::before{background:var(--gold)}.kc.gn::before{background:var(--green)}.kc.bl::before{background:var(--blue)}.kc.rd::before{background:var(--red)}.kc.pu::before{background:var(--purple)}
.kl{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.kv{font-size:22px;font-weight:700;font-family:'IBM Plex Mono',monospace;line-height:1}
.ks{font-size:11px;margin-top:5px}.ks.up{color:var(--green)}.ks.dn{color:var(--red)}.ks.n{color:var(--text2)}
.tabs{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:4px;display:flex;gap:3px;margin-bottom:18px;overflow-x:auto;flex-wrap:wrap}
.tab{padding:7px 14px;background:none;border:none;cursor:pointer;font-size:12px;color:var(--text2);border-radius:var(--r);font-family:inherit;transition:all .2s;white-space:nowrap}
.tab.on{background:var(--bg3);color:var(--text);font-weight:500}
.pane{display:none}.pane.on{display:block;animation:fi .2s ease}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:16px;margin-bottom:14px}
.st{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.st::after{content:'';flex:1;height:1px;background:var(--border)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.cw{position:relative;width:100%}
.leg{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)}
.ld{width:9px;height:9px;border-radius:2px;flex-shrink:0}
table.dt{width:100%;border-collapse:collapse;font-size:12px}
table.dt th{padding:8px 10px;font-size:10px;font-weight:600;color:var(--text2);border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
table.dt td{padding:8px 10px;border-bottom:1px solid var(--bg3);color:var(--text);vertical-align:middle}
table.dt tr:last-child td{border-bottom:none}
table.dt tr:hover td{background:rgba(255,255,255,.02)}
.tag{display:inline-flex;align-items:center;gap:2px;font-size:10px;padding:2px 6px;border-radius:3px;font-weight:500;font-family:'IBM Plex Mono',monospace}
.tg{background:rgba(63,185,80,.12);color:var(--green)}.tr{background:rgba(248,81,73,.12);color:var(--red)}.tn{background:var(--bg4);color:var(--text2)}.tbl{background:rgba(88,166,255,.12);color:var(--blue)}.tpu{background:rgba(163,113,247,.12);color:var(--purple)}
.num{font-family:'IBM Plex Mono',monospace}
.hmap{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;margin-top:8px}
.hcell{height:32px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9px;color:rgba(255,255,255,.7);cursor:default}
.hlabel{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;margin-bottom:4px}
.hlbl{font-size:9px;color:var(--text2);text-align:center}
.dmap{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.dcell{border-radius:6px;padding:10px 6px;text-align:center;font-size:11px}
.dcell-lbl{font-size:10px;color:var(--text2);margin-bottom:4px}
.dcell-val{font-size:13px;font-weight:600;font-family:'IBM Plex Mono',monospace}
.rrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bg3)}
.rrow:last-child{border-bottom:none}
.rn{font-size:16px;font-weight:700;font-family:'IBM Plex Mono',monospace;color:var(--text2);width:24px;text-align:center;flex-shrink:0}
.rnm{min-width:130px;font-size:12px;font-weight:500}
.rbb{flex:1;height:6px;background:var(--bg4);border-radius:3px;overflow:hidden}
.rbf{height:100%;border-radius:3px}
.rv{font-size:11px;font-family:'IBM Plex Mono',monospace;min-width:60px;text-align:left;color:var(--text2)}
.ri{display:flex;gap:12px;padding:10px;background:var(--bg3);border-radius:var(--r);border:1px solid var(--border);margin-bottom:6px}
.rrank{font-size:18px;font-weight:700;font-family:'IBM Plex Mono',monospace;color:var(--text2);min-width:24px}
.rb h4{font-size:12px;font-weight:600;margin-bottom:3px}
.rb p{font-size:11px;color:var(--text2);line-height:1.6}
.rec{padding:12px;background:var(--bg3);border-radius:var(--r);border:1px solid var(--border);border-right:3px solid var(--gold);margin-bottom:6px}
.rec.gn{border-right-color:var(--green)}.rec.rd{border-right-color:var(--red)}.rec.bl{border-right-color:var(--blue)}.rec.pu{border-right-color:var(--purple)}
.rec-t{font-size:12px;font-weight:600;margin-bottom:3px}
.rec-b{font-size:11px;color:var(--text2);line-height:1.6}
.exec{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:14px;font-size:12px;color:var(--text2);line-height:1.8;margin-top:14px}
.exec strong{color:var(--text)}
.spin{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:14px}
.sp{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.metric-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bg3);font-size:12px}
.metric-row:last-child{border-bottom:none}
.metric-row span:first-child{color:var(--text2)}
.metric-row span:last-child{font-family:'IBM Plex Mono',monospace;font-weight:500}
.pay-bar{height:8px;border-radius:4px;overflow:hidden;display:flex;margin-top:6px}
.pay-seg{height:100%;transition:width .5s}
@media(max-width:900px){.kgrid{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="bar">
  <div class="logo">🧁 <span>Munch Bakery — لوحة التحليل المالي</span></div>
  <div style="display:flex;align-items:center;gap:14px">
    <div class="live-b"><span class="dot"></span>تحديث تلقائي كل ساعة</div>
    <div class="upd" id="upd">—</div>
  </div>
</div>
<div class="main" id="app">
  <div class="spin"><div class="sp"></div><div style="color:var(--text2)">جارٍ تحميل البيانات…</div></div>
</div>
<script>
const C=['#f0b429','#3fb950','#58a6ff','#f85149','#a371f7','#ff9500','#00d4ff','#ff6b9d'];
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const MA=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
let D={},B=[],CH={};
const fmt=n=>Math.abs(n)>=1e6?(n/1e6).toFixed(2)+'M':Math.abs(n)>=1e3?(n/1e3).toFixed(1)+'K':Math.round(n).toLocaleString();
const fs=n=>'ر.س '+fmt(n);
const fp=n=>parseFloat(n).toFixed(1)+'%';
const dt=v=>`<span class="tag ${v>=0?'tg':'tr'}">${v>=0?'▲':'▼'} ${Math.abs(v).toFixed(1)}%</span>`;
const mk=(id,cfg)=>{const c=document.getElementById(id);if(!c)return;if(CH[id])CH[id].destroy();CH[id]=new Chart(c,cfg);return CH[id]};
const BASE={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}};

async function load(){
  const r=await fetch('data.json?t='+Date.now());
  D=await r.json(); B=D.branches||[];
  document.getElementById('upd').textContent='آخر تحديث: '+D.updated;
  const now=new Date();
  const m12=[],ml=[];
  for(let i=11;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    m12.push(d.toISOString().slice(0,7));
    const p=d.toISOString().slice(0,7).split('-');
    ml.push(MA[parseInt(p[1])-1]+" '"+p[0].slice(2));
  }
  D._m12=m12;D._ml=ml;
  const mx=B[0]?.total||1;
  B.forEach(b=>{
    const v=m12.map(m=>b.monthly?.[m]||0);
    const q4=v.slice(-3).reduce((s,x)=>s+x,0),q3=v.slice(-6,-3).reduce((s,x)=>s+x,0),q1=v.slice(0,3).reduce((s,x)=>s+x,0);
    b.qoq=q3>0?parseFloat(((q4-q3)/q3*100).toFixed(1)):0;
    b.yoy=q1>0?parseFloat(((q4-q1)/q1*100).toFixed(1)):0;
    b.rm=b.gross_margin_real||b.cogs_real?b.gross_margin_real:77;
    b.score=Math.round((b.total/mx)*45+(b.rm/90)*35+(b.qoq>0?Math.min(b.qoq/10,1)*20:0));
  });
  const tR=B.reduce((s,b)=>s+b.total,0),tT=B.reduce((s,b)=>s+(b.total_txn||0),0);
  const tG=B.reduce((s,b)=>s+(b.gross_profit_real||b.total*.77),0);
  const bM=[...B].sort((a,z)=>z.rm-a.rm)[0];
  document.getElementById('app').innerHTML=`
  <div class="hdr"><div><h2>لوحة التحليل المالي — Munch Bakery</h2><p>${B.length} فروع | بيانات لايف من Odoo POS</p></div><span class="per">📅 ${D.date_from} – ${D.date_to}</span></div>
  <div class="kgrid">
    <div class="kc g"><div class="kl">إجمالي الإيرادات</div><div class="kv">${fs(tR)}</div><div class="ks n">${B.length} فروع</div></div>
    <div class="kc gn"><div class="kl">الأرباح الحقيقية</div><div class="kv">${fs(tG)}</div><div class="ks up">▲ ${fp(tG/tR*100)} هامش</div></div>
    <div class="kc bl"><div class="kl">إجمالي المعاملات</div><div class="kv">${fmt(tT)}</div><div class="ks n">طلب</div></div>
    <div class="kc rd"><div class="kl">متوسط الفاتورة</div><div class="kv">${fs(tT>0?tR/tT:0)}</div><div class="ks n">لكل طلب</div></div>
    <div class="kc pu"><div class="kl">أعلى هامش ربح</div><div class="kv" style="font-size:14px;line-height:1.5">${bM?.name||'—'}</div><div class="ks up">${fp(bM?.rm||0)}</div></div>
  </div>
  <div class="tabs">
    <button class="tab on" onclick="sw(0)">📊 نظرة عامة</button>
    <button class="tab" onclick="sw(1)">📈 الأداء والنمو</button>
    <button class="tab" onclick="sw(2)">💰 الربحية الحقيقية</button>
    <button class="tab" onclick="sw(3)">🧁 هندسة القائمة</button>
    <button class="tab" onclick="sw(4)">⏰ التوقيت والسلوك</button>
    <button class="tab" onclick="sw(5)">💳 طرق الدفع</button>
    <button class="tab" onclick="sw(6)">🏆 التصنيف والتقرير</button>
  </div>
  <div id="panes"></div>`;
  buildPane(0);
}

function sw(i){document.querySelectorAll('.tab').forEach((b,j)=>b.classList.toggle('on',i===j));buildPane(i);}
function buildPane(i){const pc=document.getElementById('panes');pc.innerHTML='';const p=document.createElement('div');p.className='pane on';pc.appendChild(p);[p0,p1,p2,p3,p4,p5,p6][i]?.(p);}

function p0(el){
  const m12=D._m12,ml=D._ml;
  el.innerHTML=`<div class="card"><div class="st">الإيرادات الشهرية لكل فرع</div>
    <div class="leg">${B.map((b,i)=>`<div class="li"><span class="ld" style="background:${C[i%8]}"></span>${b.name}</div>`).join('')}</div>
    <div class="cw"><canvas id="cm" style="height:280px"></canvas></div></div>
  <div class="g2">
    <div class="card"><div class="st">إجمالي الإيرادات</div><div class="cw"><canvas id="ct" style="height:220px"></canvas></div></div>
    <div class="card"><div class="st">الإيرادات vs الطلبات</div>
      <table class="dt"><thead><tr><th>الفرع</th><th>الإيرادات</th><th>الطلبات</th><th>م. الفاتورة</th></tr></thead><tbody>
      ${B.map(b=>`<tr><td><strong>${b.name}</strong></td><td class="num">${fs(b.total)}</td><td class="num">${fmt(b.total_txn||0)}</td><td class="num">${fs(b.avg_ticket||0)}</td></tr>`).join('')}
      </tbody></table></div>
  </div>`;
  mk('cm',{type:'line',data:{labels:ml,datasets:B.map((b,i)=>({label:b.name,data:m12.map(m=>Math.round(b.monthly?.[m]||0)),borderColor:C[i%8],backgroundColor:C[i%8]+'15',borderWidth:2,pointRadius:3,tension:.4,fill:false}))},options:{...BASE,scales:{x:{ticks:{color:'#8b949e',font:{size:10}},grid:{color:'rgba(48,54,61,.5)'}},y:{ticks:{color:'#8b949e',callback:v=>fmt(v),font:{size:10}},grid:{color:'rgba(48,54,61,.5)'}}}}});
  mk('ct',{type:'bar',data:{labels:B.map(b=>b.name),datasets:[{data:B.map(b=>b.total),backgroundColor:C,borderRadius:5,borderSkipped:false}]},options:{...BASE,scales:{x:{ticks:{color:'#8b949e',font:{size:10}},grid:{display:false}},y:{ticks:{color:'#8b949e',callback:v=>fmt(v),font:{size:10}},grid:{color:'rgba(48,54,61,.5)'}}}}});
}

function p1(el){
  el.innerHTML=`<div class="card"><div class="st">نمو QoQ وYoY</div>
    <div class="leg"><div class="li"><span class="ld" style="background:#f0b429"></span>QoQ</div><div class="li"><span class="ld" style="background:#58a6ff"></span>YoY</div></div>
    <div class="cw"><canvas id="ch" style="height:260px"></canvas></div></div>
  <div class="st">التحليل العمودي — هيكل التكاليف</div>
  <div class="card" style="overflow-x:auto">
    <table class="dt"><thead><tr><th>الفرع</th><th>الإيرادات</th><th>هامش حقيقي%</th><th>COGS حقيقية</th><th>م. الفاتورة</th><th>QoQ</th><th>YoY</th></tr></thead><tbody>
    ${B.map((b,i)=>`<tr>
      <td><span style="display:inline-block;width:7px;height:7px;border-radius:2px;background:${C[i%8]};margin-left:7px"></span><strong>${b.name}</strong></td>
      <td class="num">${fs(b.total)}</td>
      <td><strong>${fp(b.rm)}</strong> ${b.rm>75?'<span class="tag tg">↑ممتاز</span>':b.rm>65?'<span class="tag tbl">جيد</span>':'<span class="tag tr">↓ضعيف</span>'}</td>
      <td class="num" style="color:var(--red)">${fs(b.cogs_real||0)}</td>
      <td class="num">${fs(b.avg_ticket||0)}</td>
      <td>${dt(b.qoq)}</td>
      <td>${b.yoy===0?'<span class="tag tn">جديد</span>':dt(b.yoy)}</td>
    </tr>`).join('')}
    </tbody></table></div>
  <div class="st">⚠️ الشواذ والانحرافات</div>
  ${B.filter(b=>b.qoq<-5||b.yoy<-5||b.rm<60).map(b=>`
    <div class="card" style="border-right:3px solid var(--red)">
      <div style="font-size:12px;font-weight:600;color:var(--red);margin-bottom:6px">⚠️ ${b.name}</div>
      ${b.qoq<-5?'<div class="metric-row"><span>تراجع QoQ</span><span style=\"color:var(--red)\">'+(fp(b.qoq))+'</span></div>':''}
      ${b.rm<60?'<div class="metric-row"><span>هامش منخفض</span><span style=\"color:var(--red)\">'+(fp(b.rm))+'</span></div>':''}
    </div>`).join('')||'<div class="card" style="text-align:center;color:var(--text2);padding:20px">✅ لا توجد شواذ كبيرة</div>'}`;
  mk('ch',{type:'bar',data:{labels:B.map(b=>b.name),datasets:[{label:'QoQ',data:B.map(b=>b.qoq),backgroundColor:'#f0b429',borderRadius:4},{label:'YoY',data:B.map(b=>b.yoy===0?null:b.yoy),backgroundColor:'#58a6ff',borderRadius:4}]},options:{...BASE,scales:{x:{ticks:{color:'#8b949e',font:{size:10}},grid:{color:'rgba(48,54,61,.5)'}},y:{ticks:{color:'#8b949e',callback:v=>v+'%',font:{size:10}},grid:{color:'rgba(48,54,61,.5)'},afterDataLimits:s=>{s.min=Math.min(s.min,-12);s.max=Math.max(s.max,15)}}}}});
}

function p2(el){
  el.innerHTML=`<div class="g2">
    <div class="card"><div class="st">الهامش الحقيقي لكل فرع</div><div class="cw"><canvas id="cmar" style="height:260px"></canvas></div></div>
    <div class="card"><div class="st">توزيع الأرباح الحقيقية</div><div class="cw"><canvas id="cpie" style="height:260px"></canvas></div></div>
  </div>
  <div class="st">جدول الربحية الكامل</div>
  <div class="card" style="overflow-x:auto">
    <table class="dt"><thead><tr><th>الفرع</th><th>الإيرادات</th><th>COGS</th><th>إجمالي الربح</th><th>هامش%</th><th>الطلبات</th><th>م.الفاتورة</th><th>نقاط</th></tr></thead><tbody>
    ${[...B].sort((a,b)=>b.score-a.score).map(b=>`<tr>
      <td><strong>${b.name}</strong></td>
      <td class="num">${fs(b.total)}</td>
      <td class="num" style="color:var(--red)">${fs(b.cogs_real||Math.round(b.total*.225))}</td>
      <td class="num" style="color:var(--green)"><strong>${fs(b.gross_profit_real||Math.round(b.total*.77))}</strong></td>
      <td><strong>${fp(b.rm)}</strong></td>
      <td class="num">${fmt(b.total_txn||0)}</td>
      <td class="num">${fs(b.avg_ticket||0)}</td>
      <td><span class="tag ${b.score>=70?'tg':b.score>=50?'tbl':'tr'}">${b.score}</span></td>
    </tr>`).join('')}
    </tbody></table></div>`;
  mk('cmar',{type:'bar',data:{labels:B.map(b=>b.name),datasets:[{data:B.map(b=>b.rm),backgroundColor:B.map(b=>b.rm>=75?'#3fb950':b.rm>=65?'#f0b429':'#f85149'),borderRadius:5,indexAxis:'y'}]},options:{...BASE,indexAxis:'y',scales:{x:{ticks:{color:'#8b949e',callback:v=>v+'%',font:{size:10}},grid:{color:'rgba(48,54,61,.5)'},min:50},y:{ticks:{color:'#8b949e',font:{size:10}},grid:{display:false}}}}});
  mk('cpie',{type:'doughnut',data:{labels:B.map(b=>b.name),datasets:[{data:B.map(b=>b.gross_profit_real||Math.round(b.total*.77)),backgroundColor:C,borderWidth:0}]},options:{...BASE,cutout:'60%',plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.label}: ${fs(ctx.raw)}`}}}}});
}

function p3(el){
  const prods=D.products||[];
  const avgR=prods.reduce((s,p)=>s+p.revenue,0)/Math.max(prods.length,1);
  const avgM=prods.reduce((s,p)=>s+p.margin_pct,0)/Math.max(prods.length,1);
  const stars=prods.filter(p=>p.revenue>=avgR&&p.margin_pct>=avgM).sort((a,b)=>b.revenue-a.revenue).slice(0,8);
  const quest=prods.filter(p=>p.revenue<avgR&&p.margin_pct>=avgM).sort((a,b)=>b.margin_pct-a.margin_pct).slice(0,8);
  const plow=prods.filter(p=>p.revenue>=avgR&&p.margin_pct<avgM).sort((a,b)=>b.revenue-a.revenue).slice(0,8);
  const dogs=prods.filter(p=>p.revenue<avgR&&p.margin_pct<avgM).sort((a,b)=>a.margin_pct-b.margin_pct).slice(0,6);
  const nm=p=>p.name.split('/').pop()?.trim()||p.name;
  el.innerHTML=`<div class="card"><div class="st">مصفوفة هندسة القائمة</div>
    <div class="cw"><canvas id="cme" style="height:300px"></canvas></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px">
      <div style="background:rgba(63,185,80,.08);border:1px solid rgba(63,185,80,.2);border-radius:6px;padding:8px;font-size:11px"><strong style="color:var(--green)">⭐ نجوم</strong> — هامش عالٍ + مبيعات عالية</div>
      <div style="background:rgba(88,166,255,.08);border:1px solid rgba(88,166,255,.2);border-radius:6px;padding:8px;font-size:11px"><strong style="color:var(--blue)">❓ استفهام</strong> — هامش عالٍ + مبيعات منخفضة → سوّق أكثر</div>
      <div style="background:rgba(240,180,41,.08);border:1px solid rgba(240,180,41,.2);border-radius:6px;padding:8px;font-size:11px"><strong style="color:var(--gold)">🐄 أبقار حلوب</strong> — هامش منخفض + مبيعات عالية → راجع السعر</div>
      <div style="background:rgba(248,81,73,.08);border:1px solid rgba(248,81,73,.2);border-radius:6px;padding:8px;font-size:11px"><strong style="color:var(--red)">🐕 خسائر</strong> — هامش منخفض + مبيعات منخفضة → تحقق من إلغائها</div>
    </div></div>
  <div class="g2">
    <div class="card"><div class="st">⭐ نجوم</div><table class="dt"><thead><tr><th>المنتج</th><th>إيرادات</th><th>هامش%</th></tr></thead><tbody>
    ${stars.map(p=>`<tr><td>${nm(p)}</td><td class="num">${fs(p.revenue)}</td><td><span class="tag tg">${fp(p.margin_pct)}</span></td></tr>`).join('')}
    </tbody></table></div>
    <div class="card"><div class="st">❓ علامات استفهام</div><table class="dt"><thead><tr><th>المنتج</th><th>هامش%</th><th>إيرادات</th></tr></thead><tbody>
    ${quest.map(p=>`<tr><td>${nm(p)}</td><td><span class="tag tbl">${fp(p.margin_pct)}</span></td><td class="num">${fs(p.revenue)}</td></tr>`).join('')}
    </tbody></table></div>
  </div>
  <div class="g2">
    <div class="card"><div class="st">🐄 أبقار حلوب</div><table class="dt"><thead><tr><th>المنتج</th><th>إيرادات</th><th>هامش%</th></tr></thead><tbody>
    ${plow.map(p=>`<tr><td>${nm(p)}</td><td class="num">${fs(p.revenue)}</td><td><span class="tag tn">${fp(p.margin_pct)}</span></td></tr>`).join('')}
    </tbody></table></div>
    <div class="card"><div class="st">🐕 خسائر</div><table class="dt"><thead><tr><th>المنتج</th><th>هامش%</th><th>إيرادات</th></tr></thead><tbody>
    ${dogs.map(p=>`<tr><td>${nm(p)}</td><td><span class="tag tr">${fp(p.margin_pct)}</span></td><td class="num">${fs(p.revenue)}</td></tr>`).join('')}
    </tbody></table></div>
  </div>`;
  mk('cme',{type:'scatter',data:{datasets:[
    {label:'⭐ نجوم',data:stars.map(p=>({x:p.revenue,y:p.margin_pct,label:nm(p)})),backgroundColor:'rgba(63,185,80,.7)',borderColor:'#3fb950',pointRadius:7},
    {label:'❓ استفهام',data:quest.map(p=>({x:p.revenue,y:p.margin_pct,label:nm(p)})),backgroundColor:'rgba(88,166,255,.7)',borderColor:'#58a6ff',pointRadius:7},
    {label:'🐄 حلوب',data:plow.map(p=>({x:p.revenue,y:p.margin_pct,label:nm(p)})),backgroundColor:'rgba(240,180,41,.7)',borderColor:'#f0b429',pointRadius:7},
    {label:'🐕 خسائر',data:dogs.map(p=>({x:p.revenue,y:p.margin_pct,label:nm(p)})),backgroundColor:'rgba(248,81,73,.7)',borderColor:'#f85149',pointRadius:7},
  ]},options:{...BASE,plugins:{legend:{display:true,position:'top',labels:{color:'#8b949e',font:{size:11},usePointStyle:true}},tooltip:{callbacks:{label:ctx=>`${ctx.raw.label}: ${fs(ctx.raw.x)} | ${ctx.raw.y}%`}}},scales:{x:{title:{display:true,text:'الإيرادات',color:'#8b949e'},ticks:{color:'#8b949e',callback:v=>fmt(v),font:{size:10}},grid:{color:'rgba(48,54,61,.5)'}},y:{title:{display:true,text:'هامش %',color:'#8b949e'},ticks:{color:'#8b949e',callback:v=>v+'%',font:{size:10}},grid:{color:'rgba(48,54,61,.5)'}}}}});
}

function p4(el){
  const hourly=D.hourly||Array(24).fill(0),daily=D.daily||Array(7).fill(0);
  const mH=Math.max(...hourly,1),mD=Math.max(...daily,1);
  el.innerHTML=`<div class="card"><div class="st">خريطة حرارة ساعية</div>
    <div class="hlabel">${Array.from({length:24},(_,h)=>`<div class="hlbl">${h<10?'0'+h:h}</div>`).join('')}</div>
    <div class="hmap">${hourly.map((v,h)=>`<div class="hcell" style="background:rgba(240,180,41,${.1+v/mH*.9})" title="${h}:00 — ${fs(v)}">${v>mH*.3?fmt(v):''}</div>`).join('')}</div>
    <div style="margin-top:8px;font-size:11px;color:var(--text2)">أعلى ساعة: <strong style="color:var(--gold)">${hourly.indexOf(Math.max(...hourly))}:00</strong> | ${fs(Math.max(...hourly))}</div>
  </div>
  <div class="g2">
    <div class="card"><div class="st">أداء أيام الأسبوع</div>
      <div class="dmap">${daily.map((v,d)=>`<div class="dcell" style="background:rgba(240,180,41,${.05+v/mD*.25})"><div class="dcell-lbl">${DAYS[d]}</div><div class="dcell-val">${fmt(v)}</div></div>`).join('')}</div>
    </div>
    <div class="card"><div class="st">مقارنة أيام الأسبوع</div><div class="cw"><canvas id="cdaily" style="height:200px"></canvas></div></div>
  </div>
  <div class="card"><div class="st">التوزيع الساعي</div><div class="cw"><canvas id="chourly" style="height:200px"></canvas></div></div>`;
  mk('cdaily',{type:'bar',data:{labels:DAYS,datasets:[{data:daily,backgroundColor:daily.map(v=>`rgba(240,180,41,${.3+v/mD*.7})`),borderRadius:5}]},options:{...BASE,scales:{x:{ticks:{color:'#8b949e',font:{size:10}},grid:{display:false}},y:{ticks:{color:'#8b949e',callback:v=>fmt(v),font:{size:10}},grid:{color:'rgba(48,54,61,.5)'}}}}});
  mk('chourly',{type:'line',data:{labels:Array.from({length:24},(_,h)=>(h<10?'0'+h:h)+':00'),datasets:[{data:hourly,borderColor:'#f0b429',backgroundColor:'rgba(240,180,41,.1)',borderWidth:2,fill:true,tension:.4,pointRadius:2}]},options:{...BASE,scales:{x:{ticks:{color:'#8b949e',font:{size:9}},grid:{color:'rgba(48,54,61,.5)'}},y:{ticks:{color:'#8b949e',callback:v=>fmt(v),font:{size:10}},grid:{color:'rgba(48,54,61,.5)'}}}}});
}

function p5(el){
  const pT=D.payment_totals||{},pM=Object.keys(pT);
  const pC={'Mada Card':'#3fb950','Visa':'#58a6ff','Cash':'#f0b429','مدى':'#3fb950','فيزا':'#58a6ff','نقد':'#f0b429'};
  const gc=(m,i)=>pC[m]||C[i%8];
  const tot=Object.values(pT).reduce((s,v)=>s+v,0);
  el.innerHTML=`<div class="g2">
    <div class="card"><div class="st">توزيع طرق الدفع (إجمالي)</div><div class="cw"><canvas id="cpay" style="height:240px"></canvas></div></div>
    <div class="card"><div class="st">مبالغ طرق الدفع</div>
    ${pM.map((m,i)=>`<div class="metric-row"><span style="display:flex;align-items:center;gap:6px"><span style="width:9px;height:9px;border-radius:2px;background:${gc(m,i)};display:inline-block"></span>${m}</span>
      <span>${fs(pT[m])} <span class="tag tn">${fp(pT[m]/tot*100)}</span></span></div>`).join('')}
    </div>
  </div>
  <div class="st">طرق الدفع لكل فرع</div>
  <div class="card" style="overflow-x:auto">
    <table class="dt"><thead><tr><th>الفرع</th>${pM.map(m=>`<th>${m}</th>`).join('')}<th>إجمالي</th></tr></thead><tbody>
    ${B.map(b=>{const pays=b.payments||{};const t=Object.values(pays).reduce((s,v)=>s+v,0);
      return `<tr><td><strong>${b.name}</strong></td>${pM.map(m=>`<td class="num">${pays[m]?fp(pays[m]/Math.max(t,1)*100):'—'}</td>`).join('')}<td class="num">${fs(t)}</td></tr>`;
    }).join('')}
    </tbody></table></div>`;
  mk('cpay',{type:'doughnut',data:{labels:pM,datasets:[{data:pM.map(m=>pT[m]||0),backgroundColor:pM.map((m,i)=>gc(m,i)),borderWidth:0}]},options:{...BASE,cutout:'60%',plugins:{legend:{display:true,position:'right',labels:{color:'#8b949e',font:{size:11},usePointStyle:true}},tooltip:{callbacks:{label:ctx=>`${ctx.label}: ${fs(ctx.raw)} (${fp(ctx.raw/tot*100)})`}}}}});
}

function p6(el){
  const srt=[...B].sort((a,b)=>b.score-a.score);
  const tR=B.reduce((s,b)=>s+b.total,0),tG=B.reduce((s,b)=>s+(b.gross_profit_real||b.total*.77),0),tT=B.reduce((s,b)=>s+(b.total_txn||0),0);
  el.innerHTML=`<div class="g2">
    <div><div class="st">🏆 التصنيف المركّب</div>
    <div class="card">${srt.map((b,i)=>`<div class="rrow">
      <div class="rn">${i+1}</div><div class="rnm">${b.name}</div>
      <div class="rbb"><div class="rbf" style="width:${b.score}%;background:${C[B.indexOf(b)%8]}"></div></div>
      <div class="rv">${b.score}pts</div>${dt(b.qoq)}
      <span class="tag ${b.rm>=75?'tg':b.rm>=65?'tbl':'tr'}">${fp(b.rm)}</span>
    </div>`).join('')}</div></div>
    <div>
      <div class="st">🥇 أعلى 3 فروع</div>
      ${srt.slice(0,3).map((b,i)=>`<div class="ri">
        <div class="rrank">${['🥇','🥈','🥉'][i]}</div>
        <div class="rb"><h4>${b.name}</h4><p>الإيرادات: <strong>${fs(b.total)}</strong> | هامش: <strong>${fp(b.rm)}</strong> | QoQ: ${dt(b.qoq)}</p></div></div>`).join('')}
      <div class="st" style="margin-top:14px">⚠️ يحتاج تدخلاً</div>
      ${srt.slice(-2).reverse().map((b,i)=>`<div class="ri" style="border-right:3px solid var(--red)">
        <div class="rrank" style="color:var(--red)">${i+1}</div>
        <div class="rb"><h4>${b.name}</h4><p>هامش: <strong>${fp(b.rm)}</strong> | ${b.qoq<0?'QoQ: '+dt(b.qoq)+' | ':''} إيرادات: <strong>${fs(b.total)}</strong></p></div></div>`).join('')}
    </div>
  </div>
  <div class="st">💡 التوصيات</div>
  <div class="rec gn"><div class="rec-t">🎯 هندسة القائمة — فرصة فورية</div><div class="rec-b">منتجات علامات الاستفهام تملك هامش عالٍ لكن مبيعات منخفضة — تعزيز عرضها يرفع الإيراد بدون زيادة التكلفة.</div></div>
  <div class="rec bl"><div class="rec-t">⏰ تحسين التوظيف حسب ساعات الذروة</div><div class="rec-b">خريطة الحرارة الساعية تكشف الذروة بدقة — تعديل الجداول يقلل التكلفة التشغيلية في الساعات المنخفضة.</div></div>
  ${B.some(b=>b.qoq<-5)?'<div class="rec rd"><div class="rec-t">⚠️ تدخل عاجل</div><div class="rec-b">فروع بتراجع QoQ تتطلب مراجعة تشغيلية فورية.</div></div>':''}
  <div class="rec pu"><div class="rec-t">💳 مراقبة نسبة الكاش</div><div class="rec-b">الفروع بنسبة كاش مرتفعة تحتاج إجراءات رقابة أقوى.</div></div>
  <div class="exec"><strong>📋 الملخص التنفيذي</strong><br><br>
    إجمالي الإيرادات <strong>${fs(tR)}</strong> | إجمالي الربح الحقيقي <strong>${fs(tG)}</strong> | هامش <strong>${fp(tG/tR*100)}</strong><br>
    إجمالي الطلبات <strong>${fmt(tT)}</strong> | متوسط الفاتورة <strong>${fs(tT>0?tR/tT:0)}</strong><br>
    الفرع الأول: <strong>${srt[0]?.name}</strong> بنقاط ${srt[0]?.score}
  </div>`;
}

load().catch(e=>{document.getElementById('app').innerHTML=`<div style="text-align:center;padding:60px;color:var(--red)">❌ ${e.message}</div>`;});
</script>
</body>
</html>
