name: Update Odoo Data
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Odoo data
        run: pip install requests -q && python3 fetch_data.py
      - name: Push data
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data.json
          git diff --staged --quiet || (git commit -m "Update data $(date +%F-%H%M)" && git push)
