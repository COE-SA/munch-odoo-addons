name: Refresh Odoo financial history

on:
  schedule:
    # 07:15 Asia/Riyadh on the first day of every month.
    - cron: '15 4 1 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - fetch_history.py
      - .github/workflows/update-data.yml

permissions:
  contents: write

concurrency:
  group: monthly-odoo-financial-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch complete history from Odoo
        env:
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USER: ${{ secrets.ODOO_USER }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
        run: python3 fetch_history.py

      - name: Validate executive dataset
        run: |
          python3 - <<'PY'
          import json
          from datetime import date
          with open('data.json', encoding='utf-8') as handle:
              data = json.load(handle)
          assert data.get('schema_version') == 2
          assert data.get('months'), 'No monthly history returned by Odoo'
          assert data.get('meta', {}).get('earliest_date')
          assert data.get('meta', {}).get('period_end') < date.today().isoformat()
          assert all('net_profit' in row for row in data['months'])
          print('Validated', len(data['months']), 'closed months')
          PY

      - name: Publish refreshed dataset
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data.json
          git diff --staged --quiet || (git commit -m "Financial history through $(date -u +%Y-%m)" && git push)
